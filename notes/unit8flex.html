<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Intro</title>
    <style>
        div {border: 1px solid red;}
        section {display: flex;}
        section div {flex: 1;}
        .quarter {flex: 1;}
        .three-quarters {flex: 3;}
    </style>
</head>
<body>

<section>
    <div>1</div>
</section>


<section>
    <div class="quarter">2</div>
    <div class="three-quarters">3</div>
</section>

<!-- Row 3: 1/2 and 1/2 -->
<section>
    <div>4</div>
    <div>5</div>
</section>

</body>
</html>
