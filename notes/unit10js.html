<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <script>
        function FirstFunction() {
            alert("Hello World");
        }
        function clicky () {
            alert('Thanks for clicking!');
        }
        function hovery() {
            alert('Thanks for hovering!');
        }
    </script>
</head>
<body onload="FirstFunction();">
    <h1>JavaScript Basics</h1>
    <p onclick="clicky();">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    <p onmouseover="hovery();">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
</body>
</html>
